services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: irsocial-app:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Ano da Receita verificado a cada inicio do container app.
      RECEITA_ANO: ${RECEITA_ANO:-2025}
      RECEITA_AUTO_IMPORTAR: ${RECEITA_AUTO_IMPORTAR:-true}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/api/repasses/anos', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # Importa historico e identifica novas publicacoes sem reiniciar o site.
  receita-sync:
    image: irsocial-app:local
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RECEITA_AUTO_IMPORTAR: ${RECEITA_AUTO_IMPORTAR:-true}
      RECEITA_ANO_INICIAL: ${RECEITA_ANO_INICIAL:-2021}
      RECEITA_INTERVALO_HORAS: ${RECEITA_INTERVALO_HORAS:-24}
      RECEITA_REVISAR_ANOS: ${RECEITA_REVISAR_ANOS:-2}
    command: ["node", "scripts/sincronizar-receita.js"]

volumes:
  db_data:
